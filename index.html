<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Generator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<script>
  try { const t = localStorage.getItem('limo-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --danger:#b91c1c;
          --field:#fff; --soft:#fafafa; --hover:#f9fafb; --cur:#eff6ff; --ring:#bfdbfe; color-scheme:light; }
  :root[data-theme="dark"] { --bg:#0f1115; --card:#181b22; --ink:#e5e7eb; --muted:#9ca3af; --line:#2b303b; --accent:#3b82f6; --danger:#f87171;
          --field:#10131a; --soft:#14171d; --hover:#222733; --cur:#1b2740; --ring:#1e3a8a; color-scheme:dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; }
  .left { display:flex; align-items:center; gap:14px; }
  #status { font-size:12px; color:var(--muted); }
  #status.bad { color:var(--danger); font-weight:600; }
  #backupBtn { display:none; font-size:13px; padding:6px 12px; }
  #backupBtn.warn { background:#fef3c7; border-color:#fcd34d; color:#92400e; font-weight:600; }
  :root[data-theme="dark"] #backupBtn.warn { background:rgba(245,158,11,.15); border-color:rgba(245,158,11,.4); color:#fbbf24; }
  :root[data-theme="dark"] #backupBtn.err { background:rgba(248,113,113,.15); border-color:rgba(248,113,113,.4); }
  #backupBtn.err { background:#fee2e2; border-color:#fca5a5; color:var(--danger); font-weight:600; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; color:var(--ink); border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:8px; cursor:pointer; }
  button:hover { background:var(--hover); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#1d4ed8; }
  button.danger { color:var(--danger); }
  button.small { padding:4px 10px; font-size:12px; }
  button.danger { color:var(--danger); }
  main { display:grid; grid-template-columns: var(--left, 480px) 14px minmax(0, 1fr); padding:24px; }
  main > section { min-width:0; }
  #splitter { cursor:col-resize; position:relative; touch-action:none; }
  #splitter::after { content:""; position:absolute; top:0; bottom:16px; left:5px; width:4px; border-radius:2px; background:var(--line); transition:background .15s; }
  #splitter:hover::after, #splitter.drag::after { background:var(--accent); }
  body.dragging { user-select:none; cursor:col-resize; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; gap:24px; } #splitter { display:none; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:10px; }
  input, textarea, select { width:100%; font:inherit; font-size:14px; color:var(--ink); background:var(--field); border:1px solid var(--line); border-radius:6px; padding:7px 9px; margin-top:3px; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--ring); border-color:var(--accent); }
  textarea { resize:vertical; min-height:60px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card h2 .sub { text-transform:none; letter-spacing:0; font-weight:400; }
  .hint { font-size:12px; color:var(--muted); margin:-4px 0 10px; }
  #logoRow { display:flex; align-items:center; gap:10px; }
  #logoThumb { max-height:40px; max-width:120px; display:none; }

  /* trips */
  .trip { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:var(--soft); }
  .trip-head { display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:8px; }
  .trip input { margin-top:0; }
  .trip .field { display:block; margin-bottom:8px; }
  .trip .field span { font-size:11px; color:var(--muted); }
  .route { border-left:2px solid var(--accent); margin:0 0 8px 6px; padding-left:12px; }
  .stop { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .stop::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--card); border:2px solid var(--accent); margin-left:-18px; margin-right:6px; flex:none; }
  .link { border:none; background:none; color:var(--accent); padding:2px 0; font-size:12px; }
  .link:hover { background:none; text-decoration:underline; }
  .x { padding:2px 0; width:28px; height:28px; color:var(--danger); flex:none; }
  .trip-price { max-width:160px; }

  /* drawer */
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:10; }
  #drawer { position:fixed; top:0; left:0; bottom:0; width:min(420px, 100vw); background:var(--bg); z-index:11; transform:translateX(-100%); transition:transform .2s; display:flex; flex-direction:column; box-shadow:2px 0 16px rgba(0,0,0,.15); }
  body.open #overlay { display:block; }
  body.open #drawer { transform:none; }
  .d-head { padding:14px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .d-head h2 { margin:0; font-size:16px; }
  .d-tools { padding:12px 16px 0; }
  .d-tools input { margin:0 0 10px; }
  #custList { overflow:auto; padding:4px 16px 16px; flex:1; }
  .cust { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .cust summary { padding:10px 12px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; list-style:none; }
  .cust summary::-webkit-details-marker { display:none; }
  .cust summary .meta { font-size:12px; color:var(--muted); font-weight:400; }
  .cust-body { border-top:1px solid var(--line); padding:8px 12px 12px; }
  .inv { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .inv.current { background:var(--cur); margin:0 -12px; padding:6px 12px; }
  .inv .t { font-size:12px; color:var(--muted); }
  .inv .b { display:flex; gap:6px; }
  .d-foot { padding:12px 16px; border-top:1px solid var(--line); background:var(--card); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .empty { color:var(--muted); text-align:center; padding:30px 0; }

  /* preview paper */
  .paper { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; color:#111827; background:#fff; border:1px solid var(--line); border-top:6px solid var(--accent); box-shadow:0 2px 12px rgba(0,0,0,.06); padding:44px; min-height:640px; position:sticky; top:76px; font-size:13px; }
  .p-top { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
  .p-top img { max-height:60px; max-width:200px; display:block; margin-bottom:8px; }
  .p-biz-name { font-size:18px; font-weight:700; }
  .p-biz-addr { color:var(--muted); font-size:12px; margin-top:2px; }
  .p-title { font-size:32px; font-weight:800; letter-spacing:.08em; color:var(--accent); line-height:1; }
  .p-boxes { display:grid; grid-template-columns:1.4fr 1fr; gap:12px; margin:28px 0 26px; }
  .p-box { background:#f5f7fa; border-radius:8px; padding:14px 16px; }
  .p-box h4, .p-bank h4, .p-notes h4 { margin:0 0 6px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .p-box strong { font-size:14px; }
  .p-meta { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .p-meta b { display:block; font-size:14px; }
  .pre { white-space:pre-line; }
  table.p-table { width:100%; border-collapse:collapse; }
  .p-table th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); background:#f5f7fa; padding:8px 10px; }
  .p-table td { padding:14px 10px; border-bottom:1.5px solid #d1d5db; vertical-align:top; }
  .p-table .num { width:34px; color:var(--muted); font-weight:600; }
  .p-table .n { text-align:right; white-space:nowrap; font-weight:700; font-size:14px; }
  .p-table th.n { font-size:10px; font-weight:700; }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink); margin:4px 0 0; cursor:pointer; }
  .check input { width:18px; height:18px; margin:0; accent-color:#16a34a; }
  .badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.08em; padding:2px 8px; border-radius:99px; }
  .badge.paid { color:#15803d; background:#dcfce7; } .badge.unpaid { color:#b45309; background:#fef3c7; }
  :root[data-theme="dark"] .badge.paid { color:#4ade80; background:rgba(74,222,128,.15); } :root[data-theme="dark"] .badge.unpaid { color:#fbbf24; background:rgba(251,191,36,.15); }
  .p-paid { display:inline-block; margin-top:8px; border:2px solid #15803d; color:#15803d; font-weight:800; letter-spacing:.12em; padding:2px 12px; border-radius:6px; font-size:14px; transform:rotate(-4deg); }
  .paidchk { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); margin:0; cursor:pointer; }
  .paidchk input { width:14px; height:14px; margin:0; accent-color:#16a34a; }
  .d-tools .check { font-size:13px; margin:0 0 10px; }
  .typedate { display:grid; grid-template-columns:1.5fr 1fr; gap:8px; }
  .jtype { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin-bottom:6px; }
  .leg { display:grid; grid-template-columns:40px 1fr; gap:6px; align-items:baseline; margin-bottom:3px; }
  .leg .k { font-size:9px; font-weight:700; letter-spacing:.08em; color:var(--muted); }
  .leg .v { font-size:14px; } .leg.strong .v { font-weight:700; }
  .p-total { margin:14px 0 0 auto; width:240px; padding:10px 10px 0; display:flex; justify-content:space-between; align-items:baseline; }
  .p-total span { font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--muted); } .p-total b { font-size:20px; }
  .p-bank { margin-top:24px; background:#f5f7fa; border-radius:8px; padding:14px 18px; }
  .p-bank .r { display:grid; grid-template-columns:84px 1fr; padding:3px 0; align-items:baseline; }
  .p-bank .r span { color:var(--muted); font-size:12px; } .p-bank .r b { font-size:13px; font-weight:700; letter-spacing:.02em; }
  .p-notes { margin-top:24px; font-size:12px; color:#374151; }

  /* ---------- phone layout (touch screens under 700px only; desktop is untouched) ---------- */
  .lbl-short, .phone-ico, .phone-only, .fold-sum, .chev { display:none; }
  @media (max-width: 700px) and (pointer: coarse) {
    body { font-size:15px; }
    header { padding:10px 64px 10px 14px; padding-top:max(10px, env(safe-area-inset-top)); }
    header h1 { font-size:16px; white-space:nowrap; }
    .left { gap:8px; min-width:0; }
    #themeBtn { position:fixed; top:max(7px, env(safe-area-inset-top)); right:12px; padding:6px 10px; font-size:16px; }
    #themeBtn .lbl { display:none; }
    /* actions become a bottom bar within thumb reach */
    .actions { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;
               padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); box-shadow:0 -2px 12px rgba(0,0,0,.08); }
    .actions button:not(#themeBtn) { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:52px; padding:6px 4px; font-size:12px; font-weight:600; }
    .actions .ico { font-size:18px; line-height:1; }
    .lbl-long { display:none; }
    .lbl-short, .phone-ico { display:inline; }
    main { padding:12px 12px calc(92px + env(safe-area-inset-bottom)); }
    .card { padding:14px; margin-bottom:12px; }
    input, textarea, select { font-size:16px; padding:10px 11px; }
    .check { font-size:15px; padding:5px 0; }
    .check input { width:22px; height:22px; }
    .x { width:40px; height:40px; font-size:16px; }
    .link { font-size:14px; padding:8px 0; }
    button.small { padding:8px 12px; font-size:13px; }
    #addTrip { width:100%; padding:12px; font-weight:600; }
    .trip-price { max-width:none; }
    .typedate { grid-template-columns:1fr; gap:0; }
    /* collapsible cards for things filled in once */
    .fold h2 { cursor:pointer; display:flex; align-items:baseline; gap:8px; margin:0; user-select:none; }
    .fold:not(.folded) h2 { margin-bottom:12px; }
    .fold .chev { display:inline; margin-left:auto; font-size:14px; }
    .fold.folded > :not(h2), .fold.folded h2 .sub { display:none !important; }
    .fold.folded .fold-sum { display:inline; text-transform:none; letter-spacing:0; font-weight:400; color:var(--ink); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    .fold.folded .chev { transform:rotate(-90deg); }
    /* preview is a full-screen view opened from the bottom bar */
    #pv { display:none; }
    body.preview { overflow:hidden; }
    body.preview #pv { display:block; position:fixed; inset:0; z-index:4; overflow:auto; background:var(--bg);
                       padding:64px 12px calc(92px + env(safe-area-inset-bottom)); }
    #pv .paper { position:static; width:720px; min-height:0; }
    /* suggestion chips (replace the browser's floating suggestion popup) */
    .sugg { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .sugg button { font-size:14px; padding:7px 12px; border-radius:99px; background:var(--cur); border-color:var(--ring); color:var(--ink); }
  }
</style>
</head>
<body>
<header>
  <div class="left">
    <h1>Invoice Generator</h1>
    <span id="status"></span>
    <button id="backupBtn" type="button"></button>
  </div>
  <div class="actions">
    <button id="themeBtn" type="button" title="Switch dark / light mode"></button>
    <button id="openDrawer"><span class="ico">📁</span> <span class="lbl-long">Invoices &amp; customers</span><span class="lbl-short">Invoices</span></button>
    <button id="previewBtn" class="phone-only" type="button"><span class="ico">📄</span><span>Preview</span></button>
    <button id="reset"><span class="ico phone-ico">＋</span><span class="lbl-long">New invoice</span><span class="lbl-short">New</span></button>
    <button id="download" class="primary"><span class="ico phone-ico">⤓</span><span class="lbl-long">Download PDF</span><span class="lbl-short">PDF</span></button>
  </div>
</header>

<div id="overlay"></div>
<aside id="drawer" aria-label="Invoices and customers">
  <div class="d-head"><h2>Invoices &amp; customers</h2><button id="closeDrawer" class="small">Close</button></div>
  <div class="d-tools"><input id="search" type="search" placeholder="Search customer or invoice #"><label class="check"><input type="checkbox" id="onlyUnpaid"> Show unpaid only</label></div>
  <div id="custList"></div>
  <div class="d-foot">
    <button id="exportBtn" class="small">Export backup</button>
    <button id="importBtn" class="small">Import backup</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <span class="hint" style="margin:0;flex-basis:100%">Everything is saved in this browser automatically. Export a backup now and then.</span>
  </div>
</aside>

<main>
  <section>
    <div class="card">
      <h2>Invoice</h2>
      <div class="row">
        <label>Invoice #<input id="number"></label>
        <label>Date<input type="date" id="date"></label>
        <label>Currency
          <select id="currency">
            <option value="€|EUR">€ EUR</option><option value="£|GBP">£ GBP</option><option value="$|USD">$ USD</option>
            <option value="CA$|CAD">CA$ CAD</option><option value="A$|AUD">A$ AUD</option>
          </select>
        </label>
      </div>
      <label class="check"><input type="checkbox" id="paid"> Mark this invoice as paid</label>
      <label class="check"><input type="checkbox" id="showBank"> Include payment details on this invoice</label>
    </div>

    <div class="card fold" id="fFrom">
      <h2>From <span class="sub">(your business · saved for all invoices)</span><span class="fold-sum"></span><span class="chev">▾</span></h2>
      <div id="logoRow">
        <label style="flex:1;margin:0">Logo (optional)<input type="file" id="logo" accept="image/png,image/jpeg"></label>
        <img id="logoThumb" alt="">
      </div>
      <label style="margin-top:10px">Business name<input id="fromName"></label>
      <label>Address &amp; contact<textarea id="fromAddr"></textarea></label>
    </div>

    <div class="card">
      <h2>Bill to</h2>
      <label>Customer name<input id="clientName" list="custNames" autocomplete="off" placeholder="Type or pick an existing customer"></label>
      <datalist id="custNames"></datalist>
      <datalist id="tripTypes"></datalist>
      <label>Address &amp; contact<textarea id="clientAddr"></textarea></label>
    </div>

    <div class="card">
      <h2>Trips</h2>
      <label>Default pickup point <span class="sub">(saved · new trips start with this as their From)</span><input id="defaultFrom" placeholder="e.g. Cork Airport"></label>
      <div id="trips"></div>
      <button id="addTrip" type="button">+ Add trip</button>
    </div>

    <div class="card fold" id="fBank">
      <h2>Bank details <span class="sub">(saved for all invoices)</span><span class="fold-sum"></span><span class="chev">▾</span></h2>
      <label>Bank name<input id="bankName"></label>
      <div class="row">
        <label>IBAN<input id="iban"></label>
        <label>BIC<input id="bic"></label>
      </div>
    </div>

    <div class="card fold" id="fNotes">
      <h2>Notes <span class="sub">(optional · only printed if filled in)</span><span class="fold-sum"></span><span class="chev">▾</span></h2>
      <label>Notes<textarea id="notes"></textarea></label>
    </div>
  </section>

  <div id="splitter" title="Drag to resize (double-click to reset)"></div>

  <section id="pv">
    <div class="paper" id="paper"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const KEY = 'limo-invoice-v3';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const today = () => new Date().toISOString().slice(0, 10);
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- data ---------- */
let biz = { fromName: '', fromAddr: '', defaultFrom: '', logo: '', currency: '€|EUR', bankName: '', iban: '', bic: '', journeyTypes: [], lastType: '' };
const bankLines = () => [['Bank', biz.bankName], ['IBAN', biz.iban], ['BIC', biz.bic]].filter(([, v]) => v && v.trim());
let invoices = [];           // saved invoices
let inv = null;              // invoice being edited
let saveOk = true;

const newTrip = () => ({ date: today(), type: biz.lastType || '', from: biz.defaultFrom, to: '', stops: [], price: '' });
const hasContent = i => !!i.clientName.trim() || i.trips.some(t => t.to.trim() || t.price !== '' || t.stops.some(s => s.trim()));

function nextNumber() {
  let best = null;
  for (const i of invoices) {
    const m = /^(.*?)(\d+)$/.exec(i.number || '');
    if (m && (!best || +m[2] > best.n || (+m[2] === best.n && i.savedAt > best.at))) best = { p: m[1], n: +m[2], w: m[2].length, at: i.savedAt };
  }
  return best ? best.p + String(best.n + 1).padStart(best.w, '0') : 'INV-001';
}
function createInvoice(client = {}) {
  return { id: uid(), number: nextNumber(), date: today(), currency: biz.currency, clientName: client.name || '', clientAddr: client.addr || '', paid: false, showBank: true,
           trips: [newTrip()], notes: '', savedAt: Date.now() };
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ biz, invoices, current: inv }));
    saveOk = true;
  } catch { saveOk = false; }
  renderStatus();
  scheduleBackup();
}
function renderStatus() {
  const s = $('status');
  s.className = saveOk ? '' : 'bad';
  s.textContent = saveOk ? '✓ Saved' : '⚠ Cannot save in this browser — use Export backup';
}
function load() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (raw) {
    biz = { ...biz, ...raw.biz };
    invoices = raw.invoices || [];
    inv = raw.current || null;
  } else {
    // migrate v2 single-invoice data if present
    try {
      const o = JSON.parse(localStorage.getItem('limo-invoice-v2'));
      if (o) {
        biz = { ...biz, fromName: o.fromName || '', fromAddr: o.fromAddr || '', defaultFrom: o.defaultFrom || '', logo: o.logo || '', currency: o.currency || biz.currency };
        inv = { id: uid(), number: o.number || 'INV-001', date: o.date || today(), currency: o.currency || biz.currency, clientName: o.toName || '', clientAddr: o.toAddr || '',
                trips: o.trips?.length ? o.trips : [newTrip()], notes: o.notes ?? '', savedAt: Date.now() };
        if (hasContent(inv)) invoices.push(clone(inv));
      }
    } catch {}
  }
  if (!inv) inv = createInvoice();
  if (!inv.trips.length) inv.trips.push(newTrip());
}
// upsert current invoice into the saved list (empty drafts are not listed)
function commit() {
  inv.savedAt = Date.now();
  const idx = invoices.findIndex(i => i.id === inv.id);
  if (hasContent(inv)) {
    if (idx >= 0) invoices[idx] = clone(inv); else invoices.push(clone(inv));
  } else if (idx >= 0) invoices.splice(idx, 1);
  persist();
  renderCustNames(); renderTypes();
}

/* ---------- helpers ---------- */
const sym = () => inv.currency.split('|')[0];
const moneyWith = (c, n) => c.split('|')[0] + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => moneyWith(inv.currency, n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB', { year:'numeric', month:'short', day:'numeric' }) : '';
const totalOf = i => i.trips.reduce((s, t) => s + (+t.price || 0), 0);
const stopsOf = t => t.stops.map(s => s.trim()).filter(Boolean);
const route = t => [t.from, t.to].filter(x => x && x.trim()).join(' to ');
const custKey = n => n.trim().toLowerCase();

/* ---------- editor ---------- */
function renderTrips() {
  $('trips').innerHTML = inv.trips.map((t, i) => `
    <div class="trip">
      <div class="trip-head"><span>Trip ${i + 1}</span><button class="x" data-del="${i}" title="Remove trip">✕</button></div>
      <div class="typedate"><label class="field"><span>Journey type</span><input data-i="${i}" data-k="type" list="tripTypes" autocomplete="off" value="${esc(t.type || '')}" placeholder="e.g. Limousine transfer"></label>
      <label class="field"><span>Trip date</span><input type="date" data-i="${i}" data-k="date" value="${esc(t.date || '')}"></label></div>
      <div class="route">
        <label class="field"><span>From</span><input data-i="${i}" data-k="from" value="${esc(t.from)}" placeholder="Pickup"></label>
        ${t.stops.map((s, j) => `
          <div class="stop"><input data-i="${i}" data-s="${j}" value="${esc(s)}" placeholder="Stop (e.g. Midleton Distillery)">
          <button class="x" data-i="${i}" data-delstop="${j}" title="Remove stop">✕</button></div>`).join('')}
        <button class="link" data-addstop="${i}" type="button">+ Add stop on the way</button>
        <label class="field" style="margin-top:6px"><span>To</span><input data-i="${i}" data-k="to" value="${esc(t.to)}" placeholder="Destination"></label>
      </div>
      <label class="field trip-price"><span>Price (${sym()})</span><input data-i="${i}" data-k="price" type="number" min="0" step="any" value="${esc(t.price)}"></label>
    </div>`).join('');
  phoneSuggest();
}

const tripHead = t => [(t.type || '').trim(), fmtDate(t.date)].filter(Boolean).join('  ·  ');

  const bank = bankLines();
  $('paper').innerHTML = `
    <div class="p-top">
      <div>${biz.logo ? `<img src="${biz.logo}" alt="">` : ''}<div class="p-biz-name">${esc(biz.fromName)}</div><div class="p-biz-addr pre">${esc(biz.fromAddr)}</div></div>
      <div style="text-align:right"><div class="p-title">INVOICE</div>${inv.paid ? '<div class="p-paid">PAID</div>' : ''}</div>
    </div>
    <div class="p-boxes">
      <div class="p-box"><h4>Billed to</h4><strong>${esc(inv.clientName)}</strong><div class="pre">${esc(inv.clientAddr)}</div></div>
      <div class="p-box"><div class="p-meta"><div><h4>Invoice no.</h4><b>${esc(inv.number)}</b></div><div><h4>Date</h4><b>${fmtDate(inv.date)}</b></div></div></div>
    </div>
    <table class="p-table"><thead><tr><th>#</th><th>Journey</th><th class="n" style="text-align:right">Amount</th></tr></thead><tbody>
      ${inv.trips.map((t, i) => `<tr><td class="num">${i + 1}</td><td>

        ${t.from.trim() ? `<div class="leg strong"><span class="k">FROM</span><span class="v">${esc(t.from.trim())}</span></div>` : ''}

        ${t.to.trim() ? `<div class="leg strong"><span class="k">TO</span><span class="v">${esc(t.to.trim())}</span></div>` : ''}

    ${inv.notes.trim() ? `<div class="p-notes"><h4>Notes</h4><div class="pre">${esc(inv.notes)}</div></div>` : ''}`;

/* ---------- phone: collapsible cards (only visible on phones; harmless on desktop) ---------- */
const foldSum = {
  fFrom: () => biz.fromName.trim(),
  fBank: () => biz.iban.trim() ? 'IBAN …' + biz.iban.replace(/\s/g, '').slice(-4) : biz.bankName.trim(),
  fNotes: () => inv.notes.trim().split('\n')[0]
};
function renderFolds() { for (const id in foldSum) $(id).querySelector('.fold-sum').textContent = foldSum[id]() || 'Not filled in'; }
function initFolds() { for (const id in foldSum) $(id).classList.toggle('folded', id === 'fNotes' || !!foldSum[id]()); }
document.querySelectorAll('.fold h2').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('folded')));

function update() { commit(); renderPreview(); }

function loadForm() {
  $('paid').checked = !!inv.paid; $('showBank').checked = inv.showBank !== false; $('number').value = inv.number; $('date').value = inv.date; $('currency').value = inv.currency;
  $('clientName').value = inv.clientName; $('clientAddr').value = inv.clientAddr; $('notes').value = inv.notes;
  $('fromName').value = biz.fromName; $('fromAddr').value = biz.fromAddr; $('defaultFrom').value = biz.defaultFrom;
  $('bankName').value = biz.bankName; $('iban').value = biz.iban; $('bic').value = biz.bic;
  $('logoThumb').src = biz.logo || ''; $('logoThumb').style.display = biz.logo ? 'block' : 'none';
  renderTrips(); renderPreview(); renderCustNames(); renderTypes(); renderStatus(); initFolds();
}

  $(id).addEventListener('input', e => { inv[k] = e.target.value; update(); }));

// business fields
['fromName','fromAddr','bankName','iban','bic'].forEach(k => $(k).addEventListener('input', e => { biz[k] = e.target.value; persist(); renderPreview(); }));
$('defaultFrom').addEventListener('input', e => {

$('logo').addEventListener('change', e => {

  if (!file) return;
  const r = new FileReader();

// trips
$('trips').addEventListener('input', e => {
  const d = e.target.dataset, t = inv.trips[d.i];
  if (!t) return;
  if (d.s !== undefined) t.stops[d.s] = e.target.value;
  else if (d.k) t[d.k] = e.target.value;
  update();
});
$('trips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.addstop !== undefined) {
    inv.trips[d.addstop].stops.push(''); renderTrips(); update();
    const inputs = $('trips').querySelectorAll(`input[data-i="${d.addstop}"][data-s]`); inputs[inputs.length - 1]?.focus();
  } else if (d.delstop !== undefined) { inv.trips[d.i].stops.splice(d.delstop, 1); renderTrips(); update(); }
  else if (d.del !== undefined) { inv.trips.splice(d.del, 1); if (!inv.trips.length) inv.trips.push(newTrip()); renderTrips(); update(); }
});
$('trips').addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.k !== 'type') return;
  const v = e.target.value.trim();
  if (v) { if (!biz.journeyTypes.includes(v)) biz.journeyTypes.push(v); biz.lastType = v; persist(); renderTypes(); }
});
$('addTrip').onclick = () => { inv.trips.push(newTrip()); renderTrips(); update(); };

/* ---------- new invoice (two-step confirm not needed: nothing is lost) ---------- */
function switchTo(next) {
  commit();                 // make sure the one we're leaving is stored
  inv = next;
  loadForm(); persist();
  window.scrollTo({ top: 0 });
}
$('reset').onclick = () => switchTo(createInvoice());

/* ---------- customers drawer ---------- */
function customers() {
  const map = new Map();
  [...invoices].sort((a, b) => b.savedAt - a.savedAt).forEach(i => {
    const key = custKey(i.clientName);
    if (!key) return;
    if (!map.has(key)) map.set(key, { key, name: i.clientName.trim(), addr: i.clientAddr, invoices: [] });
    map.get(key).invoices.push(i);
  });
  return [...map.values()];
}
function allTypes() {
  const set = new Set(biz.journeyTypes);
  invoices.concat(inv ? [inv] : []).forEach(i => i.trips.forEach(t => t.type && t.type.trim() && set.add(t.type.trim())));
  return [...set].sort((a, b) => a.localeCompare(b));
}
function renderTypes() { $('tripTypes').innerHTML = allTypes().map(t => '<option value="' + esc(t) + '"></option>').join(''); }
function renderCustNames() {
  $('custNames').innerHTML = customers().map(c => `<option value="${esc(c.name)}"></option>`).join('');
}

let delArm = null;
function unpaidText(list) {
  const sums = {};
  list.filter(i => !i.paid).forEach(i => { sums[i.currency] = (sums[i.currency] || 0) + totalOf(i); });
  const parts = Object.entries(sums).map(([c, n]) => moneyWith(c, n));
  return parts.length ? parts.join(' + ') + ' unpaid' : 'all paid';
}
function renderDrawer() {
  const q = $('search').value.trim().toLowerCase();
  const onlyUnpaid = $('onlyUnpaid').checked;
  const keep = i => !onlyUnpaid || !i.paid;
  const unnamed = invoices.filter(i => !custKey(i.clientName) && keep(i));
  let list = customers().map(c => ({ ...c, all: c.invoices, invoices: c.invoices.filter(keep) })).filter(c => c.invoices.length);
  if (q) list = list.filter(c => c.name.toLowerCase().includes(q) || c.invoices.some(i => (i.number || '').toLowerCase().includes(q)));
  const open = !!q || onlyUnpaid;
  const row = i => `
    <div class="inv ${i.id === inv.id ? 'current' : ''}">
      <div><strong>${esc(i.number)}</strong> <span class="t">${fmtDate(i.date)}</span> <span class="badge ${i.paid ? 'paid' : 'unpaid'}">${i.paid ? 'PAID' : 'UNPAID'}</span><br>
        <span class="t">${moneyWith(i.currency, totalOf(i))}${i.id === inv.id ? ' · editing' : ''}</span>
        <label class="paidchk"><input type="checkbox" data-paid="${i.id}" ${i.paid ? 'checked' : ''}> Paid</label></div>
      <div class="b"><button class="small" data-open="${i.id}">Open</button>
      <button class="small danger" data-delinv="${i.id}">${delArm === i.id ? 'Sure?' : 'Delete'}</button></div>
    </div>`;
  $('custList').innerHTML = (list.map(c => `
    <details class="cust" ${open || c.invoices.some(i => i.id === inv.id) ? 'open' : ''}>
      <summary><strong>${esc(c.name)}</strong><span class="meta">${c.all.length} invoice${c.all.length > 1 ? 's' : ''} · ${unpaidText(c.all)}</span></summary>
      <div class="cust-body">
        ${c.invoices.map(row).join('')}
        <div style="margin-top:10px"><button class="small primary" data-newfor="${esc(c.key)}">+ New invoice for ${esc(c.name)}</button></div>
      </div>
    </details>`).join('') +
    (!q && unnamed.length ? `<details class="cust"><summary><strong>No customer name</strong><span class="meta">${unnamed.length}</span></summary><div class="cust-body">${unnamed.map(row).join('')}</div></details>` : '')) ||
    `<div class="empty">${q ? 'No matches.' : onlyUnpaid ? 'Nothing unpaid. 🎉' : 'No saved invoices yet.<br>Invoices appear here as you create them.'}</div>`;
}
// drawer / preview are "screens" on a phone: the Android back button closes them
const overlayPush = () => { if (!history.state?.ov) history.pushState({ ov: 1 }, ''); };
const overlayPop = () => {
  const b = document.body.classList;
  if (history.state?.ov && !b.contains('open') && !b.contains('preview')) history.back();
};
const openDrawer = () => { delArm = null; renderDrawer(); document.body.classList.add('open'); overlayPush(); };
const closeDrawer = fromBack => {
  if (!document.body.classList.contains('open')) return;
  document.body.classList.remove('open');
  if (!fromBack) overlayPop();
};
$('openDrawer').onclick = openDrawer;
$('closeDrawer').onclick = () => closeDrawer();
$('overlay').onclick = () => closeDrawer();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ---------- phone: full-screen preview ---------- */
const PHONE = matchMedia('(max-width: 700px) and (pointer: coarse)');
const PAPER_W = 720;
function fitPaper() {
  $('paper').style.zoom = document.body.classList.contains('preview') ? Math.min(1, (innerWidth - 24) / PAPER_W) : '';
}
function setPreview(on, fromBack) {
  if (document.body.classList.contains('preview') === on) return;
  document.body.classList.toggle('preview', on);
  $('previewBtn').innerHTML = on ? '<span class="ico">✎</span><span>Edit</span>' : '<span class="ico">📄</span><span>Preview</span>';
  fitPaper();
  if (on) { $('pv').scrollTop = 0; overlayPush(); } else if (!fromBack) overlayPop();
}
$('previewBtn').onclick = () => setPreview(!document.body.classList.contains('preview'));
PHONE.addEventListener('change', () => { if (!PHONE.matches) setPreview(false); });
addEventListener('resize', fitPaper);
addEventListener('popstate', () => { closeDrawer(true); setPreview(false, true); });

/* ---------- phone: suggestion chips ----------
   Android draws <datalist> suggestions as a floating popup that lingers and covers the field.
   On phones the list= link is swapped for chips under the field; desktop keeps the datalist. */
function phoneSuggest() {
  document.querySelectorAll(PHONE.matches ? 'input[list]' : 'input[data-suggest]').forEach(el => {
    if (PHONE.matches) { el.dataset.suggest = el.getAttribute('list'); el.removeAttribute('list'); }
    else { el.setAttribute('list', el.dataset.suggest); delete el.dataset.suggest; }
  });
}
const sugg = document.createElement('div');
sugg.className = 'sugg';
function showSugg(el) {
  const q = el.value.trim().toLowerCase();
  const opts = [...$(el.dataset.suggest).options].map(o => o.value)
    .filter(v => v.toLowerCase() !== q && v.toLowerCase().includes(q)).slice(0, 8);
  if (!opts.length) { sugg.remove(); return; }
  sugg.innerHTML = opts.map(v => `<button type="button">${esc(v)}</button>`).join('');
  sugg.target = el;
  if (el.nextElementSibling !== sugg) el.after(sugg);
}
document.addEventListener('focusin', e => {
  if (!PHONE.matches || e.target.tagName !== 'INPUT') return;
  if (e.target.hasAttribute('list')) phoneSuggest();
  if (e.target.dataset.suggest) showSugg(e.target);
});
document.addEventListener('input', e => { if (e.target === sugg.target && PHONE.matches) showSugg(e.target); });
document.addEventListener('focusout', e => { if (e.target === sugg.target) sugg.remove(); });
sugg.addEventListener('pointerdown', e => e.preventDefault());   // keep focus in the field while tapping a chip
sugg.addEventListener('click', e => {
  const b = e.target.closest('button'), el = sugg.target;
  if (!b || !el) return;
  el.value = b.textContent;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
  sugg.remove();
  el.blur();                                                     // picked: close the keyboard
});
PHONE.addEventListener('change', phoneSuggest);
$('search').addEventListener('input', renderDrawer);
$('onlyUnpaid').addEventListener('change', renderDrawer);
$('custList').addEventListener('change', e => {
  const id = e.target.dataset.paid; if (!id) return;
  const rec = invoices.find(i => i.id === id); if (!rec) return;
  rec.paid = e.target.checked;
  if (inv.id === id) { inv.paid = rec.paid; $('paid').checked = rec.paid; renderPreview(); }
  persist(); renderDrawer();
});

$('custList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.open) {
    const found = invoices.find(i => i.id === d.open);
    if (found) { switchTo(clone(found)); closeDrawer(); }
  } else if (d.newfor) {
    const c = customers().find(c => c.key === d.newfor);
    if (c) { switchTo(createInvoice({ name: c.name, addr: c.addr })); closeDrawer(); }
  } else if (d.delinv) {
    if (delArm !== d.delinv) { delArm = d.delinv; renderDrawer(); return; }
    delArm = null;
    invoices = invoices.filter(i => i.id !== d.delinv);
    if (inv.id === d.delinv) { inv = createInvoice(); loadForm(); }
    persist(); renderDrawer(); renderCustNames();
  }
});

/* ---------- backup ---------- */
$('exportBtn').onclick = () => {
  commit();
  const blob = new Blob([JSON.stringify({ biz, invoices }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `invoice-backup-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.invoices)) throw 0;
    data.invoices.forEach(i => { const idx = invoices.findIndex(x => x.id === i.id); if (idx >= 0) invoices[idx] = i; else invoices.push(i); });
    if (data.biz && !biz.fromName && !biz.fromAddr) biz = { ...biz, ...data.biz };
    persist(); loadForm(); renderDrawer();
  } catch { alert('That file is not a valid invoice backup.'); }
});

/* ---------- PDF ---------- */
$('download').onclick = () => {
  if (!window.jspdf) { alert('PDF library failed to load. Check your internet connection and reload.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 42, R = W - M, CW = R - M;
  const accent = [37, 99, 235], ink = [17, 24, 39], grey = [107, 114, 128], rule = [209, 213, 219], tint = [245, 247, 250];
  let y = 50;
  const room = need => { if (y + need > H - 40) { doc.addPage(); doc.setFillColor(...accent).rect(0, 0, W, 8, 'F'); y = 50; } };

  doc.setFillColor(...accent).rect(0, 0, W, 8, 'F');

  // header: business (left) + title (right)
  doc.setFont('helvetica', 'bold').setFontSize(30).setTextColor(...accent).text('INVOICE', R, y + 14, { align: 'right' });
  if (inv.paid) {
    doc.setFont('helvetica', 'bold').setFontSize(12).setTextColor(21, 128, 61).setDrawColor(21, 128, 61).setLineWidth(1.5);
    doc.roundedRect(R - 54, y + 26, 54, 22, 4, 4, 'S').text('PAID', R - 27, y + 41, { align: 'center' });
  }
  let ly = y;
  if (biz.logo) {
    try {
      const p = doc.getImageProperties(biz.logo);
      const h = Math.min(50, 170 * p.height / p.width), w = h * p.width / p.height;
      doc.addImage(biz.logo, p.fileType, M, ly - 8, w, h);
      ly += h + 6;
    } catch {}
  }
  if (biz.fromName) { doc.setFont('helvetica', 'bold').setFontSize(14).setTextColor(...ink).text(biz.fromName, M, ly + 8); ly += 20; }
  if (biz.fromAddr.trim()) {
    const lines = doc.splitTextToSize(biz.fromAddr, 260);
    doc.setFont('helvetica', 'normal').setFontSize(9.5).setTextColor(...grey).text(lines, M, ly + 6);
    ly += lines.length * 12 + 4;
  }
  y = Math.max(ly, y + 30) + 20;

  // billed-to + invoice meta boxes
  const lw = CW * 0.58, rw = CW - lw - 12, pad = 14;
  doc.setFont('helvetica', 'normal').setFontSize(10);
  const addr = doc.splitTextToSize(inv.clientAddr || '', lw - pad * 2);
  const bh = Math.max(64, 54 + addr.length * 12);
  doc.setFillColor(...tint).roundedRect(M, y, lw, bh, 6, 6, 'F').roundedRect(M + lw + 12, y, rw, bh, 6, 6, 'F');
  doc.setFont('helvetica', 'bold').setFontSize(7.5).setTextColor(...grey).text('BILLED TO', M + pad, y + 20);
  doc.setFont('helvetica', 'bold').setFontSize(11.5).setTextColor(...ink).text(inv.clientName || '', M + pad, y + 36);
  doc.setFont('helvetica', 'normal').setFontSize(10).setTextColor(55, 65, 81).text(addr, M + pad, y + 50);
  const mx = M + lw + 12 + pad;
  doc.setFont('helvetica', 'bold').setFontSize(7.5).setTextColor(...grey).text('INVOICE NO.', mx, y + 20).text('DATE', mx + rw / 2 - 4, y + 20);
  doc.setFontSize(11.5).setTextColor(...ink).text(String(inv.number), mx, y + 36).text(fmtDate(inv.date), mx + rw / 2 - 4, y + 36);
  y += bh + 24;

  // trips
  const tw = CW - 34 - 100 - 12 - 44;
  const rows = inv.trips.map(t => {
    const parts = [];
    if (t.from.trim()) parts.push({ k: 'FROM', v: t.from.trim(), strong: true });
    stopsOf(t).forEach(s => parts.push({ k: 'VIA', v: s }));
    if (t.to.trim()) parts.push({ k: 'TO', v: t.to.trim(), strong: true });
    parts.forEach(p => { doc.setFont('helvetica', p.strong ? 'bold' : 'normal').setFontSize(10.5); p.lines = doc.splitTextToSize(p.v, tw); });
    const type = tripHead(t);
    return { type, parts, h: Math.max(20, parts.reduce((s, p) => s + p.lines.length * 13 + 4, 0)) + 22 + (type ? 18 : 0) };
  });
  doc.autoTable({
    startY: y,
    margin: { left: M, right: M },
    head: [['#', 'JOURNEY', 'AMOUNT']],
    body: inv.trips.map((t, i) => [String(i + 1), '', money(+t.price || 0)]),
    theme: 'plain',
    styles: { fontSize: 10, cellPadding: { top: 10, bottom: 10, left: 8, right: 8 }, textColor: ink, valign: 'top' },
    headStyles: { fillColor: tint, textColor: grey, fontStyle: 'bold', fontSize: 7.5, cellPadding: { top: 8, bottom: 8, left: 8, right: 8 } },
    columnStyles: { 0: { cellWidth: 34, textColor: grey, fontStyle: 'bold' }, 2: { halign: 'right', cellWidth: 100, fontStyle: 'bold', fontSize: 11 } },
    didParseCell: d => {
      if (d.section === 'head' && d.column.index === 2) d.cell.styles.halign = 'right';
      if (d.section === 'body') d.cell.styles.minCellHeight = rows[d.row.index].h;
    },
    didDrawCell: d => {
      if (d.section !== 'body') return;
      if (d.column.index === 1) {
        const row = rows[d.row.index];
        let yy = d.cell.y + 20;
        if (row.type) {
          doc.setFont('helvetica', 'bold').setFontSize(8.5).setTextColor(...accent).text(row.type.toUpperCase(), d.cell.x + 8, yy - 1);
          yy += 18;
        }
        row.parts.forEach(p => {
          doc.setFont('helvetica', 'bold').setFontSize(7).setTextColor(...grey).text(p.k, d.cell.x + 8, yy - 1);
          doc.setFont('helvetica', p.strong ? 'bold' : 'normal').setFontSize(10.5).setTextColor(...ink).text(p.lines, d.cell.x + 44, yy);
          yy += p.lines.length * 13 + 4;
        });
      }
      doc.setDrawColor(...rule).setLineWidth(0.9).line(d.cell.x, d.cell.y + d.cell.height, d.cell.x + d.cell.width, d.cell.y + d.cell.height);
    }
  });
  y = doc.lastAutoTable.finalY + 18;

  // total
  room(60);
  const tbw = 220;
  doc.setFont('helvetica', 'bold').setFontSize(8.5).setTextColor(...grey).text('TOTAL', R - tbw + 10, y + 16);
  doc.setFontSize(17).setTextColor(...ink).text(money(totalOf(inv)), R - 8, y + 17, { align: 'right' });
  y += 24 + 28;

  // payment details
  const bank = bankLines();
  if (bank.length && inv.showBank !== false) {
    const rowsB = bank.concat([['Reference', String(inv.number)]]);
    const bxh = 36 + rowsB.length * 20;
    room(bxh + 10);
    doc.setFillColor(...tint).roundedRect(M, y, CW, bxh, 6, 6, 'F');
    doc.setFont('helvetica', 'bold').setFontSize(8).setTextColor(...grey).text('PAYMENT DETAILS', M + 16, y + 20);
    rowsB.forEach(([k, v], n) => {
      const ry = y + 40 + n * 20;
      doc.setFont('helvetica', 'normal').setFontSize(9.5).setTextColor(...grey).text(k, M + 16, ry);
      doc.setFont('helvetica', 'bold').setFontSize(11).setTextColor(...ink).text(v, M + 90, ry);
    });
    y += bxh + 22;
  }

  // notes
  if (inv.notes.trim()) {
    const lines = doc.splitTextToSize(inv.notes, CW);
    room(24 + lines.length * 13);
    doc.setFont('helvetica', 'bold').setFontSize(8).setTextColor(...grey).text('NOTES', M, y);
    doc.setFont('helvetica', 'normal').setFontSize(10).setTextColor(55, 65, 81).text(lines, M, y + 14);
  }

  const safe = ((inv.clientName ? inv.clientName + '_' : '') + (inv.number || 'invoice')).replace(/[^\w.-]+/g, '_');
  doc.save(`${safe}.pdf`);
};

/* ---------- resizable panes ---------- */
(() => {
  const main = document.querySelector('main'), sp = $('splitter'), MIN = 320;
  const setW = w => {
    const max = main.clientWidth - 48 - 14 - 360;
    main.style.setProperty('--left', Math.max(MIN, Math.min(w, max)) + 'px');
  };
  try { const w = +localStorage.getItem('limo-split'); if (w) setW(w); } catch {}
  sp.addEventListener('pointerdown', e => {
    sp.setPointerCapture(e.pointerId);
    sp.classList.add('drag'); document.body.classList.add('dragging');
    const left = main.getBoundingClientRect().left + 24;
    const move = ev => setW(ev.clientX - left - 7);
    const up = () => {
      sp.classList.remove('drag'); document.body.classList.remove('dragging');
      sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up);
      try { localStorage.setItem('limo-split', parseInt(getComputedStyle(main).getPropertyValue('--left'))); } catch {}
    };
    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up);
  });
  sp.addEventListener('dblclick', () => { main.style.setProperty('--left', '480px'); try { localStorage.removeItem('limo-split'); } catch {} });
})();

/* ---------- automatic backup (desktop app only) ---------- */
let backupFolder = null, backupLast = null, backupErr = null, backupTimer = null;

function renderBackupUI() {
  const b = $('backupBtn');
  if (!window.backup) { b.style.display = 'none'; return; }
  b.style.display = 'inline-block';
  b.className = '';
  if (!backupFolder) { b.className = 'warn'; b.textContent = '☁ Set up backup'; b.title = 'Back up automatically to Google Drive'; }
  else if (backupErr) { b.className = 'err'; b.textContent = '⚠ Backup failed'; b.title = backupErr + ' — click to fix'; }
  else { b.textContent = backupLast ? '☁ Backed up ' + new Date(backupLast).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '☁ Backup on'; b.title = backupFolder; }
}
function scheduleBackup() {
  if (!window.backup || !backupFolder) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(doBackup, 1500);
}
async function doBackup() {
  if (!window.backup || !backupFolder) return;
  clearTimeout(backupTimer);
  const r = await window.backup.write(JSON.stringify({ biz, invoices }, null, 2));
  if (r.ok) { backupLast = r.time; backupErr = null; } else backupErr = r.error;
  renderBackupUI();
}
// merge a backup into local data: newer copy of each invoice wins, nothing is deleted
function mergeFrom(text) {
  let data;
  try { data = JSON.parse(text); } catch { return false; }
  if (!data || !Array.isArray(data.invoices)) return false;
  let changed = false;
  data.invoices.forEach(i => {
    const idx = invoices.findIndex(x => x.id === i.id);
    if (idx < 0) { invoices.push(i); changed = true; }
    else if ((i.savedAt || 0) > (invoices[idx].savedAt || 0) && inv.id !== i.id) { invoices[idx] = i; changed = true; }
  });
  const b = data.biz || {};
  Object.keys(biz).forEach(k => {
    if (Array.isArray(biz[k])) { const u = [...new Set([...biz[k], ...(b[k] || [])])]; if (u.length !== biz[k].length) { biz[k] = u; changed = true; } }
    else if (!biz[k] && b[k]) { biz[k] = b[k]; changed = true; }
  });
  if (changed) { persist(); loadForm(); if (document.body.classList.contains('open')) renderDrawer(); }
  return changed;
}
$('backupBtn').onclick = async () => {
  if (!window.backup) return;
  const r = backupFolder ? await window.backup.manage() : await window.backup.setup();
  if (!r) return;
  if (r.folder && r.folder !== backupFolder) { backupFolder = r.folder; backupErr = null; if (r.existing) mergeFrom(r.existing); }
  if (r.folder || r.action === 'now') await doBackup(); else renderBackupUI();
};
(async () => {
  if (!window.backup) return;
  try {
    backupFolder = (await window.backup.status()).folder;
    renderBackupUI();
    if (backupFolder) { const t = await window.backup.readMain(); if (t) mergeFrom(t); await doBackup(); }
  } catch { renderBackupUI(); }
})();

/* ---------- dark mode (editor only; the invoice preview and PDF stay light) ---------- */
(() => {
  const root = document.documentElement, btn = $('themeBtn');
  const paint = () => {
    const dark = root.dataset.theme === 'dark';
    btn.innerHTML = dark ? '☀️<span class="lbl"> Light</span>' : '🌙<span class="lbl"> Dark</span>';
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#181b22' : '#ffffff');
  };
  btn.onclick = () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('limo-theme', root.dataset.theme); } catch {}
    paint();
  };
  paint();
})();

/* ---------- start ---------- */
load();
loadForm();
try { navigator.storage?.persist?.(); } catch {}
// installable phone/web app: works offline once opened (not used by the desktop app, which loads from file://)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
